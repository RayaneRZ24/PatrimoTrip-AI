name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and local protocol tests (no model downloads)
        run: python -m unittest discover -s experiments/hybrid-v1 -v
      - name: JavaScript syntax
        run: node --check experiments/hybrid-v1/web/app.js
